    <script>
      // Restore the visitor's theme choice before first paint to avoid a flash.
      // Dark stays the default for visitors with no saved preference.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('kl-portfolio-theme');
        } catch (error) {
          theme = null;
        }
        var dark = theme === 'light' ? false : true;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
